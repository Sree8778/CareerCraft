name: CI — Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (validates TypeScript + bundling)
        run: npm run build
        env:
          # Dummy values so Next.js public env vars are defined at build time
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci-placeholder
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER

  # ── Backend (Python / Flask) ───────────────────────────────────────────────
  backend:
    name: Backend — Install & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: web/backend/requirements.txt

      - name: Install system libraries (weasyprint / PyMuPDF deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info fonts-liberation \
            libjpeg-dev libpng-dev zlib1g-dev poppler-utils

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install only the packages needed for offline tests
          # (skip playwright, browser-use, crawl4ai which need extra setup)
          pip install \
            Flask Flask-Cors python-dotenv \
            python-docx PyMuPDF pypdf reportlab Pillow \
            requests beautifulsoup4 jinja2 \
            google-api-python-client google-auth-oauthlib google-auth-httplib2 \
            pyotp qrcode[pil] cryptography

      - name: Run parser smoke tests
        run: python test_parser_smoke.py

      - name: Run auto-apply smoke tests
        run: python test_auto_apply_smoke.py
        continue-on-error: true   # needs Playwright — allowed to warn in CI
