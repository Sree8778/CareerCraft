name: Deploy — Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "web/backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGION: us-central1
  PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: careercraft-backend
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/careercraft/backend

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        working-directory: web/backend
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Write env-vars file
        run: |
          cat > /tmp/backend-env.yaml <<'EOF'
          BACKEND_VAULT_MASTER_KEY: "${{ secrets.BACKEND_VAULT_MASTER_KEY }}"
          FIREBASE_CREDENTIALS_B64: "${{ secrets.FIREBASE_CREDENTIALS_B64 }}"
          RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
          EMAIL_FROM: "${{ secrets.EMAIL_FROM }}"
          PLATFORM_URL: "${{ secrets.PLATFORM_URL }}"
          SUPER_ADMIN_EMAILS: "${{ secrets.SUPER_ADMIN_EMAILS }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --max-instances 3 \
            --timeout 300 \
            --env-vars-file /tmp/backend-env.yaml \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format "value(status.url)"
